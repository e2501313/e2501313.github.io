<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カフェ・ノアルシェミア</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="header">
        <h1 class="logo">カフェ・ノアルシェミア</h1>
        <p class="sub-title">※このカフェは実在しません</p>

        <button class="theme-btn" id="theme-toggle-btn" type="button" tabindex="0" accesskey="t">🌙 ダークモード</button>

        <nav class="nav" id="js-nav">
            <ul>
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#menu">MENU</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2 class="hero-text">ホッと一息つける、街の小さなカフェ</h2>
            <img src="./img/renga.jpg" alt="落ち着いたカフェの店内" class="hero-img" width="800" height="300">
        </section>

        <section id="about" class="section">
            <h2>ABOUT</h2>
            <p>こだわりの自家焙煎コーヒーと、季節の焼き菓子をご用意してお待ちしております。</p>
        </section>

        <section id="menu" class="section">
            <h2>MENU</h2>
            <div class="menu-grid">
                <article class="menu-item">
                    <img src="./img/coffee.png" alt="ブレンドコーヒー" width="220" height="140">
                    <h3>ブレンドコーヒー</h3>
                    <p>￥500</p>
                </article>
                <article class="menu-item">
                    <img src="./img/rate.png" alt="カフェラテ" width="220" height="140">
                    <h3>カフェラテ</h3>
                    <p>￥550</p>
                </article>
                <article class="menu-item">
                    <img src="./img/caki.png" alt="自家製チーズケーキ" width="220" height="140">
                    <h3>自家製チーズケーキ</h3>
                    <p>￥600</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p><small>&copy; Cafe Noarchemia. All Rights Reserved.</small></p>
    </footer>

    <script src="./js/main.js"></script>
</body>

</html>
